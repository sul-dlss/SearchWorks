name: JavaScript

on:
  pull_request:
    paths:
      - '**/*.js'
      - 'package.json'
      - 'yarn.lock'
      - 'eslint.config.js'
      - '.github/workflows/javascript.yml'

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        run: yarn lint

      - name: Run JavaScript tests
        run: npm test
